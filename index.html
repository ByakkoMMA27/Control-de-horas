<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>Control de Horarios Pro</title>
<style>
:root {
  --bg: #f0f2f5;
  --panel: #ffffff;
  --line: #d1d5db;
  --grid: #e5e7eb;
  --text: #111827;
  --muted: #6b7280;
  --accent: #2563eb;
  --green: #16a34a;
  --green-bg: #dcfce7;
  --red: #dc2626;
  --red-bg: #fee2e2;
  --orange: #d97706;
  --orange-bg: #fef3c7;
  --header-bg: #1e293b;
  --header-text: #f1f5f9;
  --tab-active: #2563eb;
  --row-even: #ffffff;
  --row-odd: #f8fafc;
  --row-hover: #eff6ff;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; }
body { font-family: "Segoe UI", system-ui, sans-serif; font-size: 13px; background: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100dvh; }

/* ── HEADER ── */
#header {
  background: var(--header-bg);
  color: var(--header-text);
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 10px;
  height: 42px;
  flex-shrink: 0;
}
#header .brand { font-size: 13px; font-weight: 700; letter-spacing: .3px; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#header button {
  background: rgba(255,255,255,.12);
  border: 1px solid rgba(255,255,255,.2);
  color: var(--header-text);
  border-radius: 4px;
  padding: 5px 9px;
  font-size: 11px;
  cursor: pointer;
  white-space: nowrap;
  font-family: inherit;
}
#header button:active { background: rgba(255,255,255,.22); }
#header label.btn-label {
  background: rgba(255,255,255,.12);
  border: 1px solid rgba(255,255,255,.2);
  color: var(--header-text);
  border-radius: 4px;
  padding: 5px 9px;
  font-size: 11px;
  cursor: pointer;
  white-space: nowrap;
}

/* ── TABS ── */
#tabsWrap {
  background: #f8fafc;
  border-bottom: 2px solid var(--grid);
  overflow-x: auto;
  flex-shrink: 0;
  scrollbar-width: none;
}
#tabsWrap::-webkit-scrollbar { display: none; }
#tabs { display: flex; min-width: max-content; }
.tab {
  padding: 7px 13px;
  font-size: 12px;
  font-weight: 500;
  color: var(--muted);
  cursor: pointer;
  border-bottom: 3px solid transparent;
  white-space: nowrap;
  user-select: none;
  border-right: 1px solid var(--grid);
  font-family: inherit;
  background: transparent;
  border-top: none;
  border-left: none;
}
.tab.active { color: var(--tab-active); border-bottom-color: var(--tab-active); font-weight: 700; background: #fff; }

/* ── SUBBAR ── */
#subbar {
  background: #fff;
  border-bottom: 1px solid var(--grid);
  padding: 4px 8px;
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
}
#subbar input[type=search] {
  flex: 1;
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 5px 8px;
  font-size: 12px;
  font-family: inherit;
  outline: none;
  background: var(--bg);
  color: var(--text);
  min-width: 0;
}
#subbar input[type=search]:focus { border-color: var(--accent); }
#subbar .hint { font-size: 11px; color: var(--muted); white-space: nowrap; }
#subbar .sbtn {
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: 4px;
  padding: 5px 10px;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
  font-family: inherit;
}
#subbar .sbtn.danger { background: var(--red); }

/* ── TABLE CONTAINER ── */
#tableWrap {
  flex: 1;
  overflow: auto;
  -webkit-overflow-scrolling: touch;
  background: var(--panel);
}

/* ── TABLE ── */
table {
  width: 100%;
  border-collapse: collapse;
  table-layout: fixed;
}

/* Column widths — compact for mobile */
.col-n   { width: 28px; }
.col-name{ width: auto; min-width: 110px; }
.col-ent { width: 72px; }
.col-sal { width: 72px; }
.col-opt { width: 52px; }

thead th {
  position: sticky;
  top: 0;
  z-index: 10;
  background: #f1f5f9;
  border: 1px solid var(--grid);
  padding: 5px 4px;
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .04em;
  color: var(--muted);
  text-align: center;
  white-space: nowrap;
  user-select: none;
}
thead th.col-name { text-align: left; padding-left: 6px; }

tbody tr { height: 40px; }
tbody tr:nth-child(even) { background: var(--row-even); }
tbody tr:nth-child(odd)  { background: var(--row-odd); }
tbody tr:active          { background: var(--row-hover); }

tbody td {
  border: 1px solid var(--grid);
  padding: 0 3px;
  vertical-align: middle;
  text-align: center;
  overflow: hidden;
}
tbody td.col-name {
  text-align: left;
  padding-left: 6px;
  padding-right: 4px;
}

/* Name cell */
.name-wrap { display: flex; align-items: center; gap: 4px; }
.name-wrap strong { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.toggle-btn {
  width: 18px; height: 18px; flex-shrink: 0;
  border: 1px solid var(--line); border-radius: 3px;
  background: #fff; cursor: pointer; font-size: 10px;
  display: flex; align-items: center; justify-content: center;
  color: var(--muted);
}

/* Expanded detail row */
tr.detail-row td {
  padding: 6px 10px;
  background: #f8fafc;
  text-align: left;
  font-size: 11px;
  color: #4b5563;
  border-top: none;
}

/* Action buttons inside cells */
.act-btn {
  display: inline-block;
  width: 100%;
  padding: 6px 0;
  font-size: 11px;
  font-weight: 700;
  border: none;
  border-radius: 3px;
  cursor: pointer;
  font-family: inherit;
  letter-spacing: .2px;
}
.act-btn.entrada { background: var(--green-bg); color: var(--green); }
.act-btn.entrada:active { background: #bbf7d0; }
.act-btn.salida  { background: var(--red-bg);   color: var(--red);   }
.act-btn.salida:active  { background: #fecaca; }

/* Options col */
.opt-btn {
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 3px;
  width: 22px; height: 22px;
  font-size: 11px;
  cursor: pointer;
  color: var(--muted);
  display: inline-flex; align-items: center; justify-content: center;
  margin: 0 1px;
}
.opt-btn:active { background: var(--bg); }

/* ── STATUS BAR ── */
#statusbar {
  background: var(--header-bg);
  color: rgba(255,255,255,.75);
  display: flex;
  align-items: center;
  gap: 0;
  flex-shrink: 0;
  height: 28px;
  overflow-x: auto;
  scrollbar-width: none;
  padding: 0 8px;
}
#statusbar::-webkit-scrollbar { display: none; }
.stat-item { font-size: 10px; white-space: nowrap; padding: 0 8px; border-right: 1px solid rgba(255,255,255,.1); }
.stat-item:last-child { border-right: none; }
.stat-item .val { font-weight: 700; color: #fff; }
.stat-item .val.g { color: #4ade80; }
.stat-item .val.r { color: #f87171; }

/* ── REGISTRO VIEW ── */
.reg-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
.reg-table th { position: sticky; top: 0; z-index: 10; background: #f1f5f9; border: 1px solid var(--grid); padding: 5px 6px; font-size: 10px; font-weight: 700; text-transform: uppercase; color: var(--muted); }
.reg-table td { border: 1px solid var(--grid); padding: 5px 6px; font-size: 11px; vertical-align: middle; }
.reg-table tr:nth-child(even) td { background: var(--row-odd); }
.chip-e { display:inline-block; background: var(--green-bg); color: var(--green); font-size:10px; font-weight:700; padding:2px 6px; border-radius:3px; }
.chip-s { display:inline-block; background: var(--red-bg);   color: var(--red);   font-size:10px; font-weight:700; padding:2px 6px; border-radius:3px; }

/* ── MODAL ── */
#modalBackdrop {
  position: fixed; inset: 0;
  background: rgba(17,24,39,.55);
  display: none; align-items: flex-end; justify-content: center;
  z-index: 200; padding: 0;
}
#modalBackdrop.open { display: flex; }
#modal {
  background: #fff;
  border-radius: 12px 12px 0 0;
  width: 100%; max-width: 480px;
  border-top: 3px solid var(--accent);
  overflow: hidden;
}
.modal-head { padding: 12px 14px; border-bottom: 1px solid var(--grid); display: flex; align-items: flex-start; justify-content: space-between; }
.modal-head h2 { font-size: 14px; }
.modal-head p  { font-size: 11px; color: var(--muted); margin-top: 3px; }
.modal-head button { background: transparent; border: 1px solid var(--line); border-radius: 4px; padding: 4px 10px; font-size: 12px; cursor: pointer; color: var(--muted); font-family: inherit; }
.modal-body { padding: 14px; display: grid; gap: 10px; }
.modal-body label { display: block; font-size: 10px; font-weight: 700; color: var(--muted); text-transform: uppercase; margin-bottom: 3px; }
.modal-body input {
  width: 100%; border: 1px solid var(--line); border-radius: 4px;
  padding: 8px 10px; font-size: 13px; font-family: inherit; outline: none;
  background: var(--bg);
}
.modal-body input:focus { border-color: var(--accent); }
.modal-foot { padding: 10px 14px; border-top: 1px solid var(--grid); display: flex; justify-content: flex-end; gap: 8px; background: #fafafa; }
.modal-foot button {
  border-radius: 5px; padding: 8px 18px; font-size: 13px; font-weight: 600;
  cursor: pointer; border: none; font-family: inherit;
}
.mf-cancel { background: var(--bg); color: var(--muted); border: 1px solid var(--line) !important; }
.mf-primary { background: var(--accent); color: #fff; }
.mf-danger  { background: var(--red);    color: #fff; }

.empty { text-align: center; color: var(--muted); padding: 28px 14px; font-size: 13px; }
</style>
</head>
<body>

<!-- HEADER -->
<div id="header">
  <span class="brand">📋 Control de Horarios</span>
  <button id="newGroupBtn">+ Grupo</button>
  <button id="exportBtn">↓ JSON</button>
  <label class="btn-label" for="importFile">↑</label>
  <input type="file" id="importFile" accept=".json,application/json" style="display:none">
</div>

<!-- TABS -->
<div id="tabsWrap"><div id="tabs"></div></div>

<!-- SUBBAR -->
<div id="subbar">
  <input type="search" id="searchInput" placeholder="Buscar…">
  <span class="hint" id="countHint"></span>
  <button class="sbtn" id="addMemberBtn" style="display:none">+ Personal</button>
  <button class="sbtn danger" id="clearBtn" style="display:none">Limpiar</button>
</div>

<!-- TABLE -->
<div id="tableWrap"><div id="content"></div></div>

<!-- STATUS BAR -->
<div id="statusbar" id="statusbar">
  <div class="stat-item">Registros: <span class="val" id="st-total">0</span></div>
  <div class="stat-item">Entradas hoy: <span class="val g" id="st-ent">0</span></div>
  <div class="stat-item">Salidas hoy: <span class="val r" id="st-sal">0</span></div>
  <div class="stat-item" id="st-label"></div>
</div>

<!-- MODAL -->
<div id="modalBackdrop">
  <div id="modal">
    <div class="modal-head">
      <div><h2 id="modalTitle"></h2><p id="modalSub"></p></div>
      <button id="closeModal">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot" id="modalFoot"></div>
  </div>
</div>

<script>
(() => {
  const STORAGE = "horarios_pro_excel_simple_v1"; // misma clave que el original
  let state = loadState();
  const openDetails = new Set();
  let memberSearch = "";

  // ── STORAGE ──────────────────────────────────────────────
  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE);
      if (!raw) return defaultState();
      const p = JSON.parse(raw);
      return {
        active: p.active || "registro",
        groups: Array.isArray(p.groups) ? p.groups : [],
        records: Array.isArray(p.records) ? p.records : []
      };
    } catch { return defaultState(); }
  }

  function defaultState() {
    return { active: "registro", groups: [], records: [] };
  }

  function saveState() {
    localStorage.setItem(STORAGE, JSON.stringify(state));
  }

  // ── HELPERS ───────────────────────────────────────────────
  function uid() { return Math.random().toString(36).slice(2,10) + Date.now().toString(36); }

  function esc(s) {
    return String(s ?? "")
      .replace(/&/g,"&amp;").replace(/</g,"&lt;")
      .replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
  }

  function fmt(ts) {
    return new Intl.DateTimeFormat("es-AR",{dateStyle:"short",timeStyle:"short"}).format(new Date(ts));
  }
  function fmtTime(ts) {
    return new Intl.DateTimeFormat("es-AR",{timeStyle:"short"}).format(new Date(ts));
  }
  function fmtDate(ts) {
    return new Intl.DateTimeFormat("es-AR",{dateStyle:"short"}).format(new Date(ts));
  }

  function groupById(id) { return state.groups.find(g => g.id === id) || null; }

  function lastRecord(groupId, memberId) {
    return [...state.records]
      .filter(r => r.groupId === groupId && r.memberId === memberId)
      .sort((a,b) => b.ts - a.ts)[0] || null;
  }

  function todayStr() { return new Date().toLocaleDateString("es-AR"); }

  // ── RENDER ────────────────────────────────────────────────
  function render() {
    renderTabs();
    renderSubbar();
    renderContent();
    renderStatus();
  }

  function renderTabs() {
    const tabs = document.getElementById("tabs");
    tabs.innerHTML = "";

    const regTab = mkTab(`Registro (${state.records.length})`, state.active === "registro", () => {
      state.active = "registro"; saveState(); render();
    });
    tabs.appendChild(regTab);

    state.groups.forEach(g => {
      const t = mkTab(g.name, state.active === g.id, () => {
        state.active = g.id; saveState(); render();
      });
      tabs.appendChild(t);
    });
  }

  function mkTab(label, active, onClick) {
    const b = document.createElement("button");
    b.className = "tab" + (active ? " active" : "");
    b.textContent = label;
    b.onclick = onClick;
    return b;
  }

  function renderSubbar() {
    const isReg = state.active === "registro";
    const group = isReg ? null : groupById(state.active);
    document.getElementById("addMemberBtn").style.display = (!isReg && group) ? "" : "none";
    document.getElementById("clearBtn").style.display = isReg ? "" : "none";
    if (!isReg && group) {
      document.getElementById("addMemberBtn").onclick = () => openMemberModal(group);
    }
    document.getElementById("clearBtn").onclick = clearRecords;
    const hint = document.getElementById("countHint");
    if (isReg) {
      hint.textContent = `${state.records.length} movimientos`;
    } else if (group) {
      const total = group.members.length;
      const search = memberSearch.trim().toLowerCase();
      const shown = search ? group.members.filter(m => m.name.toLowerCase().includes(search)).length : total;
      hint.textContent = shown === total ? `${total} personas` : `${shown}/${total}`;
    }
  }

  function renderContent() {
    if (state.active === "registro") return renderRegistro();
    const group = groupById(state.active);
    if (!group) { document.getElementById("content").innerHTML = `<div class="empty">Grupo no encontrado.</div>`; return; }
    renderGrupo(group);
  }

  function renderStatus() {
    const today = todayStr();
    const todayRec = state.records.filter(r => fmtDate(r.ts) === today);
    document.getElementById("st-total").textContent = state.records.length;
    document.getElementById("st-ent").textContent = todayRec.filter(r => r.type === "Entrada").length;
    document.getElementById("st-sal").textContent = todayRec.filter(r => r.type === "Salida").length;
    const label = document.getElementById("st-label");
    if (state.active !== "registro") {
      const g = groupById(state.active);
      label.textContent = g ? `Grupo: ${g.name}` : "";
    } else {
      label.textContent = "";
    }
  }

  // ── REGISTRO ─────────────────────────────────────────────
  function renderRegistro() {
    const records = [...state.records].sort((a,b) => b.ts - a.ts); // más reciente primero
    if (!records.length) {
      document.getElementById("content").innerHTML = `<div class="empty">Sin movimientos aún.</div>`;
      return;
    }
    const rows = records.map((r, i) => {
      const g = groupById(r.groupId);
      const m = g?.members.find(x => x.id === r.memberId);
      const chipCls = r.type === "Entrada" ? "chip-e" : "chip-s";
      return `<tr>
        <td>${records.length - i}</td>
        <td>${fmt(r.ts)}</td>
        <td>${esc(g?.name || "—")}</td>
        <td>${esc(m?.name || "—")}</td>
        <td><span class="${chipCls}">${r.type}</span></td>
      </tr>`;
    }).join("");

    document.getElementById("content").innerHTML = `
      <table class="reg-table">
        <thead><tr>
          <th style="width:28px">#</th>
          <th>Fecha/Hora</th>
          <th>Grupo</th>
          <th>Personal</th>
          <th style="width:62px">Tipo</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>`;
  }

  // ── GRUPO ────────────────────────────────────────────────
  function renderGrupo(group) {
    const search = memberSearch.trim().toLowerCase();
    const members = group.members.filter(m => !search || m.name.toLowerCase().includes(search));

    const rows = members.map((m, i) => {
      const open = openDetails.has(m.id);

      const detailRow = open ? `
        <tr class="detail-row">
          <td colspan="5" style="border-top:none;">
            <b>DNI:</b> ${esc(m.dni||"—")} &nbsp;·&nbsp; <b>Patente:</b> ${esc(m.patente||"—")}
          </td>
        </tr>` : "";

      return `
        <tr>
          <td class="col-n" style="text-align:center;color:var(--muted);font-size:10px;">${i+1}</td>
          <td class="col-name">
            <div class="name-wrap">
              <button class="toggle-btn" data-toggle="${m.id}">${open?"▴":"▾"}</button>
              <strong title="${esc(m.name)}">${esc(m.name)}</strong>
            </div>
          </td>
          <td class="col-ent" style="padding:3px 3px;">
            <button class="act-btn entrada" data-action="Entrada" data-member="${m.id}">ENTRA</button>
          </td>
          <td class="col-sal" style="padding:3px 3px;">
            <button class="act-btn salida" data-action="Salida" data-member="${m.id}">SALE</button>
          </td>
          <td class="col-opt">
            <button class="opt-btn" data-edit="${m.id}" title="Editar">✏</button>
            <button class="opt-btn" data-del="${m.id}" title="Borrar">✕</button>
          </td>
        </tr>
        ${detailRow}`;
    }).join("");

    document.getElementById("content").innerHTML = `
      <table>
        <thead><tr>
          <th class="col-n">#</th>
          <th class="col-name">Personal</th>
          <th class="col-ent">Entrada</th>
          <th class="col-sal">Salida</th>
          <th class="col-opt">⚙</th>
        </tr></thead>
        <tbody>${rows || `<tr><td colspan="6" class="empty">Sin resultados.</td></tr>`}</tbody>
      </table>`;

    // Events
    document.querySelectorAll("[data-toggle]").forEach(b => {
      b.onclick = () => {
        const id = b.dataset.toggle;
        openDetails.has(id) ? openDetails.delete(id) : openDetails.add(id);
        renderGrupo(group);
      };
    });

    document.querySelectorAll("[data-action]").forEach(b => {
      b.onclick = () => registerMovement(group.id, b.dataset.member, b.dataset.action);
    });

    document.querySelectorAll("[data-edit]").forEach(b => {
      b.onclick = () => openMemberModal(group, group.members.find(m => m.id === b.dataset.edit));
    });

    document.querySelectorAll("[data-del]").forEach(b => {
      b.onclick = () => deleteMember(group.id, b.dataset.del);
    });
  }

  // ── ACTIONS ──────────────────────────────────────────────
  function registerMovement(groupId, memberId, type) {
    state.records.push({ id: uid(), ts: Date.now(), groupId, memberId, type });
    saveState();
    render();
    // Flash feedback
    const btn = document.querySelector(`[data-action="${type}"][data-member="${memberId}"]`);
    if (btn) {
      const orig = btn.textContent;
      btn.textContent = type === "Entrada" ? "✔ OK" : "✔ OK";
      btn.style.opacity = ".6";
      setTimeout(() => { btn.textContent = orig; btn.style.opacity = ""; }, 700);
    }
  }

  function clearRecords() {
    if (!state.records.length) return;
    if (!confirm("¿Limpiar todo el registro de movimientos?")) return;
    state.records = [];
    saveState();
    render();
  }

  function deleteMember(groupId, memberId) {
    const group = groupById(groupId);
    const member = group?.members.find(m => m.id === memberId);
    if (!group || !member) return;
    if (!confirm(`¿Borrar a "${member.name}"?`)) return;
    group.members = group.members.filter(m => m.id !== memberId);
    state.records = state.records.filter(r => !(r.groupId === groupId && r.memberId === memberId));
    openDetails.delete(memberId);
    saveState();
    render();
  }

  function deleteGroup(id) {
    const group = groupById(id);
    if (!group) return;
    if (!confirm(`¿Eliminar el grupo "${group.name}"?`)) return;
    state.groups = state.groups.filter(g => g.id !== id);
    state.records = state.records.filter(r => r.groupId !== id);
    if (state.active === id) state.active = "registro";
    saveState();
    render();
  }

  // ── MODALS ───────────────────────────────────────────────
  function openGroupModal(group = null) {
    const editing = !!group;
    showModal(
      editing ? "Editar grupo" : "Nuevo grupo",
      editing ? "Modificar nombre" : "Crear nueva pestaña",
      `<label>Nombre del grupo</label>
       <input id="mGroupName" value="${esc(group?.name||"")}" placeholder="Ej: Operaciones" autofocus>`,
      [
        mkModalBtn("Cancelar","mf-cancel", closeModalFn),
        ...(editing ? [mkModalBtn("Eliminar grupo","mf-danger", () => { closeModalFn(); deleteGroup(group.id); })] : []),
        mkModalBtn(editing?"Guardar":"Crear","mf-primary", () => {
          const name = document.getElementById("mGroupName").value.trim();
          if (!name) return;
          if (editing) { group.name = name; }
          else { const g = {id:uid(),name,members:[]}; state.groups.push(g); state.active = g.id; }
          saveState(); closeModalFn(); render();
        })
      ]
    );
  }

  function openMemberModal(group, member = null) {
    const editing = !!member;
    showModal(
      editing ? "Editar personal" : "Agregar personal",
      group.name,
      `<label>Apellido y nombre</label>
       <input id="mName" value="${esc(member?.name||"")}" placeholder="Ej: Pérez Juan" autofocus>
       <label>DNI</label>
       <input id="mDni" value="${esc(member?.dni||"")}" placeholder="Solo números">
       <label>Patente</label>
       <input id="mPat" value="${esc(member?.patente||"")}" placeholder="Ej: AA123BB">`,
      [
        mkModalBtn("Cancelar","mf-cancel",closeModalFn),
        mkModalBtn(editing?"Guardar":"Agregar","mf-primary", () => {
          const name = document.getElementById("mName").value.trim();
          if (!name) return;
          const dni = document.getElementById("mDni").value.trim();
          const patente = document.getElementById("mPat").value.trim();
          if (editing) { member.name=name; member.dni=dni; member.patente=patente; }
          else { group.members.push({id:uid(),name,dni,patente}); }
          saveState(); closeModalFn(); render();
        })
      ]
    );
  }

  function showModal(title, sub, bodyHtml, footBtns) {
    document.getElementById("modalTitle").textContent = title;
    document.getElementById("modalSub").textContent = sub;
    document.getElementById("modalBody").innerHTML = bodyHtml;
    const foot = document.getElementById("modalFoot");
    foot.innerHTML = "";
    footBtns.forEach(b => foot.appendChild(b));
    document.getElementById("modalBackdrop").classList.add("open");
    // autofocus
    setTimeout(() => document.getElementById("modalBody").querySelector("input")?.focus(), 80);
  }

  function closeModalFn() {
    document.getElementById("modalBackdrop").classList.remove("open");
    document.getElementById("modalBody").innerHTML = "";
    document.getElementById("modalFoot").innerHTML = "";
  }

  function mkModalBtn(text, cls, onClick) {
    const b = document.createElement("button");
    b.className = cls; b.textContent = text; b.onclick = onClick; return b;
  }

  // ── EXPORT / IMPORT ──────────────────────────────────────
  function exportJSON() {
    const blob = new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "control_horarios.json"; a.click();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
  }

  function importJSON(file) {
    const r = new FileReader();
    r.onload = () => {
      try {
        const p = JSON.parse(r.result);
        state.active = p.active || "registro";
        state.groups = Array.isArray(p.groups) ? p.groups : [];
        state.records = Array.isArray(p.records) ? p.records : [];
        if (state.active !== "registro" && !state.groups.some(g=>g.id===state.active)) state.active = "registro";
        saveState(); render();
      } catch { alert("Archivo inválido."); }
    };
    r.readAsText(file);
  }

  // ── EVENTS ───────────────────────────────────────────────
  document.getElementById("newGroupBtn").onclick = () => openGroupModal();
  document.getElementById("exportBtn").onclick = exportJSON;
  document.getElementById("importFile").onchange = e => {
    const f = e.target.files?.[0];
    if (f) importJSON(f);
    e.target.value = "";
  };
  document.getElementById("closeModal").onclick = closeModalFn;
  document.getElementById("modalBackdrop").onclick = e => { if (e.target===document.getElementById("modalBackdrop")) closeModalFn(); };
  document.getElementById("searchInput").oninput = e => { memberSearch = e.target.value; render(); };
  window.onkeydown = e => { if (e.key==="Escape") closeModalFn(); };

  // ── INIT ─────────────────────────────────────────────────
  if (!state.groups.length) {
    // Pre-carga el JSON original si no hay datos
    const RAW = {"active":"fxdhq7ltmpgo6clk","groups":[{"id":"fxdhq7ltmpgo6clk","name":"Valtom","members":[{"id":"023zz0aimpgo6o49","name":"Alvarenga Ramon","dni":"","patente":""},{"id":"mvwkwsqcmpgo6yba","name":"Arguello Gonzalo","dni":"","patente":""},{"id":"vfdo0kxsmpgo770m","name":"Cespedes Fidel","dni":"","patente":""},{"id":"vraa6tfbmpgo9g8t","name":"Chávez Evaristo","dni":"","patente":""},{"id":"movl9xcampgo9y1e","name":"Chávez Evelio","dni":"","patente":""},{"id":"81z9rm86mpgoa577","name":"Gaona Ruben","dni":"","patente":""},{"id":"415i2ek0mpgoagkt","name":"Gómez Orlando","dni":"","patente":""},{"id":"94eazy14mpgpbpvd","name":"Islas Damian","dni":"","patente":""}]},{"id":"gqb5g48fmpgoawne","name":"Some","members":[{"id":"v33bpue0mpgob2fn","name":"Gómez Juan","dni":"","patente":""},{"id":"qexpl8ytmpgoc7x9","name":"Gómez Luis","dni":"","patente":""},{"id":"uocpv0s5mpgocf9i","name":"Gómez Roman","dni":"","patente":""},{"id":"19m6fs3ampgocll7","name":"Moreyra Ariel","dni":"","patente":""},{"id":"cxuy3fkcmpgod1jn","name":"Sánchez Javier","dni":"","patente":""},{"id":"qg3xhiqkmpgod7ie","name":"Sánchez Matias","dni":"","patente":""},{"id":"l8z08lfumpgodeno","name":"Rojas Gustavo","dni":"","patente":""},{"id":"2vm3too4mpgoeopm","name":"Filloy Carlos","dni":"","patente":""},{"id":"zgcrmmjkmpgpatdc","name":"Marino Javier","dni":"","patente":""},{"id":"c78gx958mpgpb3eb","name":"Jarak Francisco","dni":"","patente":""}]},{"id":"uwqmg5b2mpgogble","name":"Pacciani CC","members":[{"id":"6t1bqg7cmpgoh0nw","name":"Matias Do Santo","dni":"","patente":""},{"id":"j7za7yyympgohafp","name":"Sergio Orellana","dni":"","patente":""},{"id":"918dmsrumpgok0qj","name":"Enzo Mercado","dni":"","patente":""},{"id":"bvp0910empgoka83","name":"Marcelo Orellana","dni":"","patente":""},{"id":"owlep4zampgokk33","name":"Martin Prieto","dni":"","patente":""},{"id":"uqeo62ngmpgokskl","name":"Marcelo Diarte","dni":"","patente":""},{"id":"zjsc74ebmpgol5dl","name":"Mariano Mendez","dni":"","patente":""},{"id":"xwv1eyhqmpgole5q","name":"Scoccia Guilermo","dni":"","patente":""},{"id":"cubxy6kvmpgolmci","name":"Sosa Mario","dni":"","patente":""},{"id":"7wck4k9fmpgoltll","name":"Galarza Nelson","dni":"","patente":""},{"id":"8toohs5ympgom1pm","name":"Gonzalez Jorge","dni":"","patente":""},{"id":"qs6div9kmpgomc1p","name":"Sebastián Talavera","dni":"","patente":""},{"id":"oiuvrfstmpgomsjj","name":"Alejandro Estigarribia","dni":"","patente":""},{"id":"hqbi9vwnmpgpbc52","name":"Pacciani Javier","dni":"","patente":""}]},{"id":"7cj5ij4ampgoo4h2","name":"SIE(DyL)","members":[{"id":"nno8osixmpgoocae","name":"Luis Garcia","dni":"","patente":""},{"id":"49s3extnmpgooi96","name":"Brutos Dario","dni":"","patente":""},{"id":"4ws7fyz0mpgop5cx","name":"Sandoval Eduardo","dni":"","patente":""},{"id":"zrys7q01mpgopdlo","name":"Ruiz Daniel","dni":"","patente":""},{"id":"8hl107ljmpgopoij","name":"Acuña Jose","dni":"","patente":""},{"id":"znvxuex4mpgoq51r","name":"Bazan Gabriel","dni":"","patente":""}]}],"records":[]};
    state.groups = RAW.groups;
    state.active = RAW.active;
    saveState();
  }

  if (state.active !== "registro" && !state.groups.some(g => g.id === state.active)) {
    state.active = "registro";
  }

  render();
})();
